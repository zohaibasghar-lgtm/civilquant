name: CivilQuant Standalone Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check engineering computations
        run: node --test tests/*.test.mjs
      - name: Install Expo dependencies
        run: |
          npm install --no-audit --no-fund
          CI=1 npx expo install --fix
      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile standalone APK with bundled JavaScript
        working-directory: android
        env:
          CI: '1'
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          keytool -genkeypair -keystore "$RUNNER_TEMP/cq-test.jks" -storepass android -keypass android -alias cq -keyalg RSA -keysize 2048 -validity 365 -dname "CN=CivilQuant Test, O=CivilQuant, C=PK"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace             -Pandroid.injected.signing.store.file="$RUNNER_TEMP/cq-test.jks"             -Pandroid.injected.signing.store.password=android             -Pandroid.injected.signing.key.alias=cq             -Pandroid.injected.signing.key.password=android
      - name: Verify signed release APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/CivilQuant-standalone.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify dist/CivilQuant-standalone.apk
          sha256sum dist/CivilQuant-standalone.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CivilQuant-Standalone-Android-APK
          path: dist/
          retention-days: 30
      - name: Publish publicly downloadable beta APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/CivilQuant-standalone.apk dist/SHA256SUMS.txt \
            --title "CivilQuant Beta ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Android sideload-only beta. BBS, quantity takeoff, offline drawing OCR, camera and PDF measurement sheets. Cloud AI and real paid subscriptions are disabled until separately configured. Test AdMob banners do not generate revenue. Signing key is temporary; uninstall older betas before installing a new one."
