name: CivilQuant Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate calculation engine
        run: node --test tests/*.test.mjs
      - name: Install Expo dependencies
        run: |
          npm install --no-audit --no-fund
          CI=1 npx expo install --fix
      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build Android signed debug APK
        working-directory: android
        env:
          CI: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CivilQuant-test.apk
          sha256sum dist/CivilQuant-test.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CivilQuant-Android-APK
          path: dist/
          retention-days: 30
